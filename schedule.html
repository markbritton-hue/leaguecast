<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeagueCast — Tournament Schedule</title>
  <link rel="icon" href="LTD-transparent.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#060a14', 900: '#0a0f1e', 800: '#0d1530', 700: '#1a2444', 600: '#243060' },
            forest: { 700: '#1a4731', 600: '#1e5c3a', 500: '#2d7a52', 400: '#3a9966' },
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="./light-mode.css">
  <script src="./theme.js"></script>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen">

  <script src="./firebase-init.js"></script>

  <nav class="bg-navy-800 border-b border-forest-700 px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="text-amber-400 font-bold text-xl flex items-center gap-0 p-0"><img src="icons/Leaguecastlogotrans.webp" alt="LeagueCast" class="h-12 w-auto object-contain"> LeagueCast</a>
    <div class="flex items-center gap-2">
      <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-navy-700 transition-colors text-xl">☀️</button>
      <a href="index.html" class="bg-navy-700 hover:bg-navy-600 text-slate-200 hover:text-amber-400 px-4 py-2 rounded-lg font-semibold text-sm border border-navy-600 hover:border-amber-400 transition-colors">← Home</a>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto" x-data="schedulePage" x-init="init()">

    <div class="pt-4 mb-6">
      <h1 class="text-2xl font-bold text-amber-400">Tournament Schedule</h1>
    </div>

    <div x-show="loading" class="flex justify-center py-12">
      <div class="w-8 h-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div x-show="!loading && tournaments.length === 0" class="text-center py-16 text-slate-400">
      <div class="text-5xl mb-4">🏆</div>
      <p class="text-lg">No tournaments yet.</p>
    </div>

    <div x-show="!loading" class="space-y-3">
      <template x-for="t in tournaments" :key="t.id">
        <div>
          <div x-show="t.isPrevious" class="text-xs font-bold text-navy-400 uppercase tracking-wide pt-2 pb-1">Previous</div>
          <div x-show="t.isFirstUpcoming" class="text-xs font-bold text-navy-400 uppercase tracking-wide pt-2 pb-1">Upcoming</div>
          <div class="border rounded-xl p-4 transition-colors"
            :id="isToday(t) ? 'today-tournament' : ''"
            :class="isToday(t)
              ? 'bg-amber-500/15 border-amber-400/60 ring-1 ring-amber-400/40 shadow-lg shadow-amber-500/10'
              : t.status === 'open' ? 'bg-forest-700/20 border-forest-500/50' : 'bg-navy-800 border-navy-700'">

          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-white text-lg" x-text="t.name"></span>
                <span x-show="isToday(t)"
                  class="flex items-center gap-1 text-xs bg-amber-500 text-amber-950 font-black px-2.5 py-1 rounded-full tracking-wide">
                  ⭐ TODAY
                </span>
                <span x-show="t.status === 'open' && !isToday(t)"
                  class="flex items-center gap-1 text-xs bg-forest-600 text-forest-300 font-bold px-2.5 py-1 rounded-full">
                  <span class="w-1.5 h-1.5 rounded-full bg-forest-400 animate-pulse"></span> ACTIVE
                </span>
              </div>
              <div class="text-sm text-slate-400 mt-0.5" x-text="formatDate(t.date)"></div>
              <div x-show="t.locationName" class="text-xs text-slate-500 mt-0.5" x-text="t.locationName"></div>

              <!-- Info chips -->
              <div class="flex gap-2 mt-2 flex-wrap">
                <span x-show="t.startTime" class="text-xs bg-navy-700 border border-navy-600 text-slate-300 px-2 py-0.5 rounded-full">
                  🕐 Start <span x-text="formatTime(t.startTime)"></span>
                </span>
                <span x-show="t.noWakeTime" class="text-xs bg-navy-700 border border-navy-600 text-slate-300 px-2 py-0.5 rounded-full">
                  ⚓ No wake <span x-text="formatTime(t.noWakeTime)"></span>
                </span>
                <span x-show="t.sizeLimit" class="text-xs bg-navy-700 border border-navy-600 text-slate-300 px-2 py-0.5 rounded-full">
                  📏 <span x-text="t.sizeLimit"></span>" min
                </span>
              </div>
            </div>

            <!-- Map link -->
            <a x-show="t.mapsLink" :href="t.mapsLink" target="_blank"
              class="bg-amber-500/10 hover:bg-amber-500/25 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-amber-500/40 hover:border-amber-400 transition-colors flex-shrink-0">
              📍 Map
            </a>
          </div>

          <!-- View results, gallery & boat order buttons -->
          <div class="mt-3 flex gap-2 flex-wrap">
            <a :href="`results.html?id=${t.id}`"
              class="inline-block bg-navy-700 hover:bg-navy-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-semibold transition-colors border border-navy-600">
              View Results →
            </a>
            <a :href="`tournament-gallery.html?id=${t.id}`"
              class="inline-flex items-center gap-2 bg-amber-500/10 hover:bg-amber-500/25 text-amber-400 px-4 py-2 rounded-lg text-sm font-semibold transition-colors border border-amber-500/40 hover:border-amber-400">
              📸 Gallery
              <span x-show="photoCounts[t.id] > 0"
                class="bg-amber-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full leading-none"
                x-text="photoCounts[t.id]"></span>
            </a>
            <a x-show="t.status === 'open'" :href="`boat-order.html?id=${t.id}`"
              class="inline-flex items-center gap-2 bg-navy-700 hover:bg-navy-600 text-slate-300 hover:text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors border border-navy-600">
              🚤 Boat Order
            </a>
          </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      const db = firebase.firestore();

      Alpine.data('schedulePage', () => ({
        tournaments: [],
        photoCounts: {},
        loading: true,

        async init() {
          db.collection('tournaments').orderBy('date', 'asc').onSnapshot(async snap => {
            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const today = new Date();
            const getDate = t => t.date?.toDate?.() || new Date(t.date);
            const past = all.filter(t => getDate(t) < today).sort((a, b) => getDate(b) - getDate(a));
            const upcoming = all.filter(t => getDate(t) >= today).sort((a, b) => getDate(a) - getDate(b));
            const lastWeek = past.length ? [{ ...past[0], isPrevious: true }] : [];
            const olderPast = past.slice(1);
            if (upcoming.length) upcoming[0] = { ...upcoming[0], isFirstUpcoming: true };
            this.tournaments = [...lastWeek, ...upcoming, ...olderPast];
            this.loading = false;
            // Load photo counts for all tournaments
            const counts = {};
            await Promise.all(this.tournaments.map(async t => {
              const snap = await db.collection('tournaments').doc(t.id).collection('photos').get();
              counts[t.id] = snap.size;
            }));
            this.photoCounts = counts;
            // Scroll to today's tournament after DOM updates
            this.$nextTick(() => {
              const el = document.getElementById('today-tournament');
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
          });
        },

        isToday(t) {
          if (!t.date) return false;
          const d = t.date.toDate ? t.date.toDate() : new Date(t.date);
          const today = new Date();
          return d.getFullYear() === today.getFullYear()
            && d.getMonth() === today.getMonth()
            && d.getDate() === today.getDate();
        },

        formatDate(ts) {
          if (!ts) return '—';
          const d = ts.toDate ? ts.toDate() : new Date(ts);
          return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        },

        formatTime(t) {
          if (!t) return '';
          const [h, m] = t.split(':').map(Number);
          const ampm = h >= 12 ? 'PM' : 'AM';
          return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${ampm}`;
        }
      }));
    });
  </script>
</body>
</html>
