<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeagueCast — Manage</title>
  <link rel="icon" href="LTD-transparent.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#060a14', 900: '#0a0f1e', 800: '#0d1530', 700: '#1a2444', 600: '#243060' },
            forest: { 700: '#1a4731', 600: '#1e5c3a', 500: '#2d7a52', 400: '#3a9966' },
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="./light-mode.css">
  <script src="./theme.js"></script>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen">

  <script src="./firebase-init.js"></script>
  <script src="./auth-guard.js"></script>

  <nav class="bg-navy-800 border-b border-forest-700 px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="text-amber-400 font-bold text-xl flex items-center gap-0 p-0"><img src="icons/Leaguecastlogotrans.webp" alt="LeagueCast" class="h-12 w-auto object-contain"> LeagueCast</a>
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-navy-700 hover:bg-navy-600 text-slate-200 hover:text-amber-400 px-4 py-2 rounded-lg font-semibold text-sm border border-navy-600 hover:border-amber-400 transition-colors">← Home</a>
      <button onclick="firebase.auth().signOut().then(() => window.location.href='login.html')"
        class="bg-navy-700 hover:bg-red-900 text-slate-400 hover:text-red-400 px-4 py-2 rounded-lg text-sm font-semibold border border-navy-600 hover:border-red-800 transition-colors">
        Sign Out
      </button>
    </div>
  </nav>

  <main class="p-4 sm:p-6 max-w-lg mx-auto">

    <div class="pt-6 pb-6 text-center">
      <h1 class="text-2xl font-bold text-amber-400">Manage</h1>
      <p class="text-slate-500 text-sm mt-1">League administration</p>
    </div>

    <div class="grid grid-cols-2 gap-4">

      <a href="tournaments.html"
        class="bg-navy-800 border border-navy-700 hover:border-amber-500/50 hover:bg-navy-700 rounded-2xl p-6 flex flex-col items-center gap-3 transition-all group">
        <img src="icons/tournament.webp" alt="Icon" class="w-16 h-16 object-contain">
        <div class="text-center">
          <div class="text-white font-bold text-lg group-hover:text-amber-400 transition-colors">Tournaments</div>
          <div class="text-slate-500 text-xs mt-0.5">Create &amp; manage events</div>
        </div>
      </a>

      <a href="teams.html"
        class="bg-navy-800 border border-navy-700 hover:border-forest-500/50 hover:bg-navy-700 rounded-2xl p-6 flex flex-col items-center gap-3 transition-all group">
        <span class="text-5xl">👥</span>
        <div class="text-center">
          <div class="text-white font-bold text-lg group-hover:text-forest-400 transition-colors">Teams</div>
          <div class="text-slate-500 text-xs mt-0.5">Manage anglers</div>
        </div>
      </a>

    </div>

    <div class="mt-4 space-y-2" x-data="exportManager">
      <button @click="exportData()" :disabled="exporting"
        class="w-full bg-navy-800 border border-navy-700 hover:border-amber-500/50 hover:bg-navy-700 disabled:opacity-50 rounded-2xl p-4 flex items-center justify-center gap-3 transition-all text-slate-200 hover:text-amber-400 font-semibold">
        <span x-text="exporting ? 'Exporting...' : '⬇ Export Data (Backup)'"></span>
      </button>
      <button @click="exportToSheets()" :disabled="exportingCsv"
        class="w-full bg-navy-800 border border-navy-700 hover:border-forest-500/50 hover:bg-navy-700 disabled:opacity-50 rounded-2xl p-4 flex items-center justify-center gap-3 transition-all text-slate-200 hover:text-forest-400 font-semibold">
        <span x-text="exportingCsv ? 'Exporting...' : '📊 Export to Google Sheets (.xlsx)'"></span>
      </button>
      <div x-show="exportError" class="mt-2 text-red-400 text-sm text-center" x-text="exportError"></div>
      <p class="text-slate-500 text-xs text-center mt-2">
        Downloads one .xlsx file with a tab per data type (Teams, Tournaments, Weigh-ins, Check-ins, Photos). In Google Sheets: File → Import → Upload, then choose "Insert new sheet(s)".
      </p>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      const db = firebase.firestore();

      const MAX_CELL_LEN = 32000;

      function flatten(obj, prefix = '', out = {}) {
        for (const [key, value] of Object.entries(obj || {})) {
          const path = prefix ? `${prefix}.${key}` : key;
          if (value && typeof value.toDate === 'function') {
            out[path] = value.toDate().toISOString();
          } else if (Array.isArray(value)) {
            out[path] = value.map(v => (v && typeof v === 'object') ? JSON.stringify(v) : v).join(' | ');
          } else if (value && typeof value === 'object') {
            flatten(value, path, out);
          } else if (typeof value === 'string' && value.length > MAX_CELL_LEN) {
            out[path] = value.startsWith('data:') ? '[image data omitted]' : value.slice(0, MAX_CELL_LEN) + '…';
          } else {
            out[path] = value;
          }
        }
        return out;
      }

      function sheetFromRows(rows) {
        const headers = [];
        for (const row of rows) {
          for (const key of Object.keys(row)) {
            if (!headers.includes(key)) headers.push(key);
          }
        }
        return XLSX.utils.json_to_sheet(rows, { header: headers });
      }

      Alpine.data('exportManager', () => ({
        exporting: false,
        exportingCsv: false,
        exportError: null,

        async exportData() {
          this.exporting = true;
          this.exportError = null;
          try {
            const backup = {};

            for (const name of ['teams', 'weighins', 'checkins']) {
              const snap = await db.collection(name).get();
              backup[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }

            const tournamentsSnap = await db.collection('tournaments').get();
            backup.tournaments = [];
            for (const doc of tournamentsSnap.docs) {
              const photosSnap = await doc.ref.collection('photos').get();
              backup.tournaments.push({
                id: doc.id,
                ...doc.data(),
                photos: photosSnap.docs.map(p => ({ id: p.id, ...p.data() }))
              });
            }

            backup.exportedAt = new Date().toISOString();

            const json = JSON.stringify(backup, (key, value) =>
              value && value.toDate ? value.toDate().toISOString() : value, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leaguecast-backup-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          } catch (e) {
            this.exportError = 'Error exporting data. Please try again.';
            console.error(e);
          }
          this.exporting = false;
        },

        async exportToSheets() {
          this.exportingCsv = true;
          this.exportError = null;
          try {
            const dateStr = new Date().toISOString().slice(0, 10);

            const teamsSnap = await db.collection('teams').get();
            const teamRows = teamsSnap.docs.map(d => flatten({ id: d.id, ...d.data() }));
            const teamNameById = {};
            teamsSnap.docs.forEach(d => { teamNameById[d.id] = d.data().teamName; });

            const tournamentsSnap = await db.collection('tournaments').get();
            const tournamentNameById = {};
            tournamentsSnap.docs.forEach(d => { tournamentNameById[d.id] = d.data().name; });

            const withNames = (row) => {
              if ('teamId' in row) row.teamName = teamNameById[row.teamId] || '';
              if ('tournamentId' in row) row.tournamentName = tournamentNameById[row.tournamentId] || '';
              return row;
            };

            const weighinsSnap = await db.collection('weighins').get();
            const weighinRows = weighinsSnap.docs.map(d => withNames(flatten({ id: d.id, ...d.data() })));

            const checkinsSnap = await db.collection('checkins').get();
            const checkinRows = checkinsSnap.docs.map(d => withNames(flatten({ id: d.id, ...d.data() })));

            const tournamentRows = [];
            const photoRows = [];
            for (const doc of tournamentsSnap.docs) {
              tournamentRows.push(flatten({ id: doc.id, ...doc.data() }));
              const photosSnap = await doc.ref.collection('photos').get();
              photosSnap.docs.forEach(p => photoRows.push(withNames(flatten({ tournamentId: doc.id, id: p.id, ...p.data() }))));
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, sheetFromRows(teamRows), 'Teams');
            XLSX.utils.book_append_sheet(wb, sheetFromRows(tournamentRows), 'Tournaments');
            XLSX.utils.book_append_sheet(wb, sheetFromRows(weighinRows), 'Weigh-ins');
            XLSX.utils.book_append_sheet(wb, sheetFromRows(checkinRows), 'Check-ins');
            XLSX.utils.book_append_sheet(wb, sheetFromRows(photoRows), 'Photos');
            XLSX.writeFile(wb, `leaguecast-export-${dateStr}.xlsx`);
          } catch (e) {
            this.exportError = 'Error exporting data. Please try again.';
            console.error(e);
          }
          this.exportingCsv = false;
        }
      }));
    });
  </script>
</body>
</html>
