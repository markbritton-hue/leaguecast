<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeagueCast — Fish Call Tags</title>
  <link rel="icon" href="LTD-transparent.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#060a14', 900: '#0a0f1e', 800: '#0d1530', 700: '#1a2444', 600: '#243060' },
            forest: { 700: '#1a4731', 600: '#1e5c3a', 500: '#2d7a52', 400: '#3a9966' },
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="./light-mode.css">
  <script src="./theme.js"></script>
  <style>
    .swatch { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; }
    .swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.5); }
    .swatch.used { opacity: 0.2; cursor: not-allowed; transform: none !important; border-color: transparent !important; }
    .fish-card { border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); transition: transform 0.2s, box-shadow 0.2s; }
    .fish-card:focus-within { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .weight-field input { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 0.6rem 0.5rem; color: #e2e8f0; font-size: 1.1rem; font-weight: 700; font-family: inherit; text-align: center; transition: border-color 0.2s; }
    .weight-field input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
    .fish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .group-header { grid-column: 1 / -1; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.4rem 0.75rem; border-radius: 6px; display: flex; align-items: center; gap: 0.5rem; }
    .group-header.top5 { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
    .group-header.others { background: rgba(148,163,184,0.08); color: #64748b; border: 1px solid rgba(148,163,184,0.15); margin-top: 0.25rem; }
    @media (max-width: 500px) { .fish-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen">

  <nav class="bg-navy-800 border-b border-forest-700 px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="text-amber-400 font-bold text-xl flex items-center gap-0 p-0">
      <img src="icons/Leaguecastlogotrans.webp" alt="LeagueCast" class="h-12 w-auto object-contain"> LeagueCast
    </a>
    <div class="flex items-center gap-2">
      <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-navy-700 transition-colors text-xl">☀️</button>
      <a href="index.html" class="bg-navy-700 hover:bg-navy-600 text-slate-200 hover:text-amber-400 px-4 py-2 rounded-lg font-semibold text-sm border border-navy-600 hover:border-amber-400 transition-colors">← Home</a>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto pb-16">

    <!-- Header -->
    <div class="pt-4 mb-5">
      <div class="text-xs text-amber-400 font-bold uppercase tracking-wider mb-1">Weigh-In Tool</div>
      <h1 class="text-2xl font-black text-white">Fish Call Tags</h1>
      <p class="text-slate-500 text-sm mt-0.5">Track individual fish by color tag during call-out</p>
    </div>

    <!-- Top action cards row -->
    <div class="grid grid-cols-2 gap-3 mb-3">

      <!-- Call Out card-button -->
      <button id="callout-btn" onclick="toggleCallOut()"
        class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-navy-900 rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-lg transition-all border-2 border-amber-400/50">
        <span class="text-2xl">🎣</span>
        <span class="font-black text-sm uppercase tracking-wide">Call Out</span>
      </button>

      <!-- Total Weight card -->
      <div class="bg-navy-800 border-2 border-navy-600 rounded-2xl p-4 flex flex-col items-center justify-center gap-1 shadow-lg">
        <span class="text-xs font-bold uppercase tracking-wide text-slate-500">Total Weight</span>
        <span id="grand-total" class="font-black text-lg text-amber-400 leading-tight">0.000 lbs</span>
      </div>

    </div>

    <!-- Add Tag card-button -->
    <button id="add-tag-btn" onclick="toggleColorPicker()"
      class="w-full mb-3 bg-forest-700 hover:bg-forest-600 active:scale-95 border-2 border-forest-600/60 text-white rounded-2xl px-5 py-4 font-black text-base flex items-center justify-center gap-2 transition-all shadow-lg disabled:opacity-40 disabled:cursor-not-allowed">
      <span class="text-xl">＋</span> Add Call Tag
    </button>

    <!-- Color picker panel -->
    <div id="color-picker" class="hidden bg-navy-800 border border-navy-700 rounded-xl p-4 mb-4">
      <p class="text-slate-500 text-sm mb-3">Pick a color for this call tag:</p>
      <div id="color-swatches" class="flex flex-wrap gap-3"></div>
    </div>

    <!-- Fish grid -->
    <div id="fish-grid" class="fish-grid mb-6"></div>

    <!-- Action row -->
    <div class="flex gap-3">
      <button onclick="saveData()" class="flex-1 py-3 px-5 rounded-xl font-bold text-base bg-forest-600 hover:bg-forest-500 text-white transition-all flex items-center justify-center gap-2">
        💾 Save
      </button>
      <button onclick="clearAll()" class="py-3 px-5 rounded-xl font-bold text-base bg-navy-700 hover:bg-navy-600 text-slate-300 border border-navy-600 transition-all">
        Clear All
      </button>
    </div>
    <div id="save-msg" class="mt-3 text-center text-forest-400 text-sm min-h-5"></div>

  </main>

  <!-- Call Out Modal -->
  <div id="callout-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end justify-center" onclick="closeCallOut()">
    <div class="bg-navy-800 border-t border-navy-600 rounded-t-2xl w-full max-w-lg shadow-2xl pb-safe" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-navy-700">
        <div>
          <div class="text-xs text-amber-400 font-bold uppercase tracking-wider mb-0.5">Call Out Order</div>
          <div class="text-white font-black text-lg">Fish Rankings</div>
        </div>
        <button onclick="closeCallOut()" class="text-slate-400 hover:text-white text-2xl leading-none px-2">×</button>
      </div>
      <div id="callout-list" class="px-5 py-3 space-y-2 max-h-96 overflow-y-auto"></div>
      <div class="px-5 pb-5 pt-2 border-t border-navy-700 flex items-center justify-between">
        <span class="text-slate-400 text-sm font-semibold">Total</span>
        <span id="callout-total" class="text-amber-400 font-black text-lg"></span>
      </div>
    </div>
  </div>

  <script src="./firebase-init.js"></script>
  <script>
    const ALL_COLORS = ['#3b82f6','#10b981','#a78bfa','#facc15','#ef4444','#06b6d4','#f97316','#ec4899'];
    const STORAGE_KEY = 'leaguecast_calltags';
    const db = firebase.firestore();
    const liveDocRef = db.collection('calltags').doc('live');
    let pushTimer = null;

    let activeTags = [];
    let pickerOpen = false;

    function pushLive() {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => {
        const data = activeTags.map(t => ({ color: t.color, val: getWeight(t.color).val }));
        liveDocRef.set({ tags: data, updatedAt: Date.now() }).catch(e => console.warn('pushLive failed', e));
      }, 400);
    }

    function ck(color) { return color.replace('#', ''); }

    function renderSwatches() {
      const used = activeTags.map(t => t.color);
      const container = document.getElementById('color-swatches');
      container.innerHTML = '';
      ALL_COLORS.forEach(color => {
        const div = document.createElement('div');
        div.className = 'swatch' + (used.includes(color) ? ' used' : '');
        div.style.background = color;
        div.title = color;
        if (!used.includes(color)) div.onclick = () => addTag(color);
        container.appendChild(div);
      });
      document.getElementById('add-tag-btn').disabled = used.length >= ALL_COLORS.length;
    }

    function toggleColorPicker() {
      pickerOpen = !pickerOpen;
      const panel = document.getElementById('color-picker');
      const btn = document.getElementById('add-tag-btn');
      panel.classList.toggle('hidden', !pickerOpen);
      btn.innerHTML = pickerOpen ? '✕ Cancel' : '+ Add Call Tag';
    }

    function addTag(color) {
      activeTags.push({ color, lbs: 0, oz: 0 });
      renderCard(color);
      renderSwatches();
      pickerOpen = false;
      document.getElementById('color-picker').classList.add('hidden');
      document.getElementById('add-tag-btn').innerHTML = '+ Add Call Tag';
      onWeightChange();
      const lbsInput = document.getElementById('lbs-' + ck(color));
      if (lbsInput) {
        lbsInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => lbsInput.focus(), 300);
      }
    }

    function renderCard(color) {
      const grid = document.getElementById('fish-grid');
      const id = ck(color);
      const card = document.createElement('div');
      card.className = 'fish-card';
      card.dataset.color = color;
      card.id = 'card-' + id;
      card.style.borderColor = color + '55';
      card.innerHTML = `
        <div style="background:${color}22; padding:0.75rem 1rem;" class="flex items-center justify-between">
          <div style="background:${color}; width:28px; height:28px; border-radius:50%; flex-shrink:0;"></div>
          <button onclick="removeTag('${color}')" style="background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;font-size:1.1rem;padding:0;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='rgba(255,255,255,0.4)'">✕</button>
        </div>
        <div style="padding:0.75rem 1rem 1rem;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.4rem;">Weight</div>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <div class="weight-field" style="flex:1;display:flex;flex-direction:column;gap:0.2rem;">
              <input type="number" id="wt-${id}" min="0" max="99.999" step="0.001" placeholder="0.000" inputmode="decimal" oninput="onWeightChange()" style="border-color:${color}44;">
              <span style="font-size:0.7rem;color:#64748b;text-align:center;">lbs</span>
            </div>
          </div>
          <div id="fish-total-${id}" style="margin-top:0.5rem;font-size:0.82rem;color:#94a3b8;text-align:right;"></div>
        </div>`;
      grid.appendChild(card);
    }

    function removeTag(color) {
      activeTags = activeTags.filter(t => t.color !== color);
      const card = document.getElementById('card-' + ck(color));
      if (card) card.remove();
      renderSwatches();
      onWeightChange();
    }

    function getWeight(color) {
      const val = parseFloat(document.getElementById('wt-' + ck(color))?.value) || 0;
      return { val, totalOz: val * 16 };
    }

    function sortGrid() {
      const grid = document.getElementById('fish-grid');
      const cards = Array.from(grid.querySelectorAll('.fish-card'));
      cards.sort((a, b) => getWeight(b.dataset.color).val - getWeight(a.dataset.color).val);
      cards.forEach(c => grid.appendChild(c));
    }

    function onWeightChange() {
      let grandLbs = 0;
      activeTags.forEach(t => {
        const w = getWeight(t.color);
        const el = document.getElementById('fish-total-' + ck(t.color));
        if (el) el.innerHTML = w.val > 0 ? '<strong style="color:#e2e8f0;font-size:0.95rem;">' + w.val.toFixed(3) + ' lbs</strong>' : '';
        grandLbs += w.val;
      });
      document.getElementById('grand-total').textContent = grandLbs.toFixed(3) + ' lbs';
      pushLive();
    }

    function saveData() {
      const data = activeTags.map(t => ({ color: t.color, val: getWeight(t.color).val }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      const msg = document.getElementById('save-msg');
      msg.textContent = '✓ Saved to this device';
      setTimeout(() => msg.textContent = '', 3000);
    }

    function loadSaved() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        data.forEach(t => {
          if (!t.color) return;
          activeTags.push({ color: t.color });
          renderCard(t.color);
          if (t.val !== undefined) document.getElementById('wt-' + ck(t.color)).value = t.val;
        });
        renderSwatches();
        onWeightChange();
      } catch(e) { console.warn('loadSaved failed', e); }
    }

    function clearAll() {
      if (!confirm('Remove all call tags and weights?')) return;
      activeTags = [];
      document.getElementById('fish-grid').innerHTML = '';
      onWeightChange();
      renderSwatches();
      localStorage.removeItem(STORAGE_KEY);
      liveDocRef.set({ tags: [], updatedAt: Date.now() }).catch(e => console.warn('pushLive failed', e));
    }

    function toggleCallOut() {
      sortGrid();
      const allSorted = activeTags
        .map(t => ({ color: t.color, val: getWeight(t.color).val }))
        .filter(t => t.val > 0)
        .sort((a, b) => b.val - a.val);

      const list = document.getElementById('callout-list');
      list.innerHTML = '';

      if (allSorted.length < 6) {
        list.innerHTML = `<div class="text-slate-500 text-sm text-center py-6">No call out — need a 6th fish heavier than your lightest to trigger a cull.</div>`;
      } else {
        // Fish #6 in weight order = the fish bumped out of the top 5 = the called out fish
        const calledOut = allSorted[5];
        list.innerHTML = `
          <div class="text-center py-4">
            <div class="text-xs font-bold uppercase tracking-wider text-red-400 mb-1">🔴 Call Out</div>
            <div class="text-xs text-slate-500 mb-4">This fish is out of the bag</div>
            <div style="background:${calledOut.color}; width:80px; height:80px; border-radius:50%; margin:0 auto 1.25rem; box-shadow:0 0 28px ${calledOut.color}99;"></div>
            <div class="text-6xl font-black text-white mb-1">${calledOut.val.toFixed(3)}</div>
            <div class="text-xl font-bold text-red-400">lbs</div>
          </div>
        `;
      }

      const total = allSorted.reduce((s, t) => s + t.val, 0);
      document.getElementById('callout-total').textContent = total.toFixed(3) + ' lbs';
      document.getElementById('callout-modal').classList.remove('hidden');
    }

    function closeCallOut() {
      document.getElementById('callout-modal').classList.add('hidden');
    }

    renderSwatches();
    loadSaved();
  </script>

</body>
</html>
