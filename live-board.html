<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeagueCast — Live Board</title>
  <link rel="icon" href="LTD-transparent.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 950: '#060a14', 900: '#0a0f1e', 800: '#0d1530', 700: '#1a2444', 600: '#243060' },
            forest: { 700: '#1a4731', 600: '#1e5c3a', 500: '#2d7a52', 400: '#3a9966' },
            amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-navy-900 text-slate-100 min-h-screen">

  <script src="./firebase-init.js"></script>

  <main class="p-6" x-data="liveBoard" x-init="init()">

    <div x-show="loading" class="flex justify-center py-12">
      <div class="w-8 h-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <div x-show="!loading && leaderboard.length === 0" class="text-center py-16 text-slate-400">
      <p class="text-lg">No standings yet.</p>
    </div>

    <div x-show="!loading && leaderboard.length > 0">
      <div class="flex items-center gap-3 mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-amber-400">Season Standings</h2>
        <div class="flex-1 h-px bg-navy-700"></div>
      </div>

      <!-- Podium -->
      <div x-show="leaderboard.length >= 3" class="grid grid-cols-3 gap-3 mb-6">
        <div x-show="leaderboard[0]" class="bg-amber-500/20 border border-amber-500/40 rounded-xl p-4 flex flex-col items-center text-center">
          <img src="goldfish-trophy1.png" alt="1st Place" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
          <div class="text-xs text-amber-400 font-bold uppercase tracking-wider mt-1">1st Place</div>
          <div class="text-white font-bold text-sm leading-tight mt-1 truncate w-full" x-text="leaderboard[0]?.team?.angler1?.name + ' & ' + leaderboard[0]?.team?.angler2?.name"></div>
          <div class="text-amber-400 font-black text-lg sm:text-xl mt-2" x-text="leaderboard[0]?.totalWeight.toFixed(3) + ' lbs'"></div>
        </div>
        <div x-show="leaderboard[1]" class="bg-slate-600/30 border border-slate-600/50 rounded-xl p-4 flex flex-col items-center text-center">
          <img src="trophy-fish-award2.png" alt="2nd Place" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider mt-1">2nd Place</div>
          <div class="text-slate-100 font-bold text-sm leading-tight mt-1 truncate w-full" x-text="leaderboard[1]?.team?.angler1?.name + ' & ' + leaderboard[1]?.team?.angler2?.name"></div>
          <div class="text-slate-300 font-black text-lg sm:text-xl mt-2" x-text="leaderboard[1]?.totalWeight.toFixed(3) + ' lbs'"></div>
        </div>
        <div x-show="leaderboard[2]" class="bg-orange-700/20 border border-orange-700/30 rounded-xl p-4 flex flex-col items-center text-center">
          <img src="fish-trophy3.png" alt="3rd Place" class="w-16 h-16 sm:w-20 sm:h-20 object-contain">
          <div class="text-xs text-orange-400 font-bold uppercase tracking-wider mt-1">3rd Place</div>
          <div class="text-slate-100 font-bold text-sm leading-tight mt-1 truncate w-full" x-text="leaderboard[2]?.team?.angler1?.name + ' & ' + leaderboard[2]?.team?.angler2?.name"></div>
          <div class="text-orange-300 font-black text-lg sm:text-xl mt-2" x-text="leaderboard[2]?.totalWeight.toFixed(3) + ' lbs'"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <template x-for="entry in leaderboard" :key="entry.team.id">
          <div class="bg-navy-800 border border-navy-700 rounded-xl flex items-center gap-3 px-4 py-3">
            <div class="w-12 h-12 flex-shrink-0 flex items-center justify-center">
              <img x-show="entry.rank === '1'" src="goldfish-trophy1.png" alt="1st Place" class="w-12 h-12 object-contain">
              <img x-show="entry.rank === '2'" src="trophy-fish-award2.png" alt="2nd Place" class="w-12 h-12 object-contain">
              <img x-show="entry.rank === '3'" src="fish-trophy3.png" alt="3rd Place" class="w-12 h-12 object-contain">
              <span x-show="entry.rank !== '1' && entry.rank !== '2' && entry.rank !== '3'" class="font-black text-lg text-slate-400" x-text="entry.rank"></span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-white text-base leading-tight truncate" x-text="entry.team.teamName"></div>
              <div class="text-slate-500 text-xs mt-0.5 truncate" x-text="entry.team.angler1.name + ' & ' + entry.team.angler2.name"></div>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="font-black text-sm"
                :class="entry.rank === '1' ? 'text-amber-400' : 'text-white'"
                x-text="entry.totalWeight.toFixed(3) + ' lbs'"></div>
              <div x-show="entry.biggestBass > 0" class="text-slate-400 text-xs"
                x-text="'🐟 ' + entry.biggestBass.toFixed(3) + ' lbs'"></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('alpine:init', () => {
      const db = firebase.firestore();

      function getBigFish(w) {
        return w.bigFish || w.bigBassWeight || 0;
      }

      function buildSeasonLeaderboard(teams, weighins, tournaments) {
        const byTournament = {};
        weighins.forEach(w => {
          if (!byTournament[w.tournamentId]) byTournament[w.tournamentId] = [];
          byTournament[w.tournamentId].push(w);
        });

        const teamPoints = {};
        teams.forEach(t => {
          teamPoints[t.id] = { team: t, totalWeight: 0, totalPoints: 0, wins: 0, biggestBass: 0, tournamentsEntered: 0 };
        });

        tournaments.forEach(tournament => {
          const tWeighins = (byTournament[tournament.id] || [])
            .sort((a, b) => b.totalWeight - a.totalWeight || getBigFish(b) - getBigFish(a));
          const n = tWeighins.length;

          tWeighins.forEach((w, idx) => {
            if (!teamPoints[w.teamId]) return;
            teamPoints[w.teamId].totalWeight += w.totalWeight || 0;
            teamPoints[w.teamId].tournamentsEntered += 1;

            const bass = getBigFish(w);
            if (bass > teamPoints[w.teamId].biggestBass) teamPoints[w.teamId].biggestBass = bass;

            const firstTiedIdx = tWeighins.findIndex(x =>
              x.totalWeight === w.totalWeight && getBigFish(x) === getBigFish(w)
            );
            teamPoints[w.teamId].totalPoints += n - firstTiedIdx;
            if (idx === 0) teamPoints[w.teamId].wins += 1;
          });
        });

        const list = Object.values(teamPoints)
          .filter(e => e.tournamentsEntered > 0)
          .sort((a, b) => {
            if (b.totalWeight !== a.totalWeight) return b.totalWeight - a.totalWeight;
            return b.biggestBass - a.biggestBass;
          });

        let prevVal = null, prevBass = null, prevRankLabel = '1';
        return list.map((entry, i) => {
          let rankLabel;
          if (i === 0) { rankLabel = '1'; }
          else if (entry.totalWeight === prevVal && entry.biggestBass === prevBass) {
            rankLabel = 'T-' + prevRankLabel.replace('T-', '');
          } else {
            rankLabel = String(i + 1);
            prevRankLabel = rankLabel;
          }
          prevVal = entry.totalWeight;
          prevBass = entry.biggestBass;
          return { ...entry, rank: rankLabel };
        });
      }

      Alpine.data('liveBoard', () => ({
        leaderboard: [],
        loading: true,

        async init() {
          const [teamsSnap, tournamentsSnap, weighinsSnap] = await Promise.all([
            db.collection('teams').get(),
            db.collection('tournaments').get(),
            db.collection('weighins').get()
          ]);
          const teams = teamsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const tournaments = tournamentsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const weighins = weighinsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          this.leaderboard = buildSeasonLeaderboard(teams, weighins, tournaments);
          this.loading = false;
        }
      }));
    });
  </script>
</body>
</html>
